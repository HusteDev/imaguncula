[workspace]
members = [
  "crates/imaguncula-cli",
  "crates/imaguncula-core",
  "crates/imaguncula-presets",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
rust-version = "1.94"
authors = ["HusteDev"]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
