[package]
name = "imaguncula-presets"
description = "Versioned platform-preset data for Imaguncula"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/HusteDev/imaguncula"
readme = "../../README.md"
keywords = ["icons", "presets", "favicon", "assets"]
categories = ["multimedia::images"]

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"

[dev-dependencies]
jsonschema = { version = "=0.49.2", default-features = false }
