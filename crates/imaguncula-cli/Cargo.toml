[package]
name = "imaguncula-cli"
description = "Headless command-line interface for the Imaguncula icon generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/HusteDev/imaguncula"
readme = "../../README.md"
keywords = ["icons", "favicon", "ico", "pwa", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "imaguncula"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
imaguncula-core = { version = "=1.0.0-beta.1", path = "../imaguncula-core" }
serde_json = "=1.0.151"
thiserror = "=2.0.19"

[dev-dependencies]
tempfile = "=3.27.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/imaguncula-cli-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
