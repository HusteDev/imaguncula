name: Desktop E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-driver:
    name: tauri-driver smoke and axe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install desktop and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
          # Ubuntu renamed webkit2gtk-driver to webkitgtk-webdriver.
          sudo apt-get install --yes webkitgtk-webdriver || sudo apt-get install --yes webkit2gtk-driver

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: e2e

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run desktop smoke and accessibility audit
        run: xvfb-run pnpm test:e2e
