name: Post-release distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without the v prefix
        required: true
        type: string
      submit:
        description: Submit Winget and push the Homebrew tap after generation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Workflow-dispatch inputs reach shell steps only through `env:` so a crafted
# value cannot escape a script before its own validation runs.
env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  winget:
    name: Generate Winget update
    runs-on: windows-latest
    timeout-minutes: 20
    environment: winget
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate the requested version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Version must be SemVer without a v prefix."
          }

      - name: Resolve the published NSIS installer
        id: release
        shell: pwsh
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$env:RELEASE_VERSION" | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -Like "*-setup.exe" | Select-Object -First 1
          if (-not $asset) { throw "Release has no NSIS setup asset." }
          "installer_url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Install pinned WingetCreate
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/winget-create/releases/download/v1.28.1.0/wingetcreate.exe"
          $expected = "63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413"
          Invoke-WebRequest $url -OutFile wingetcreate.exe
          $actual = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "wingetcreate.exe hash $actual does not match the pinned $expected."
          }

      - name: Generate reviewed manifest update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          SUBMIT: ${{ inputs.submit }}
          INSTALLER_URL: ${{ steps.release.outputs.installer_url }}
        run: |
          New-Item -ItemType Directory -Force distribution/winget | Out-Null
          Push-Location distribution/winget
          $token = if ($env:SUBMIT -eq "true") {
            if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { throw "WINGET_CREATE_GITHUB_TOKEN is required for submission." }
            $env:WINGET_CREATE_GITHUB_TOKEN
          } else {
            $env:GH_TOKEN
          }
          $arguments = @(
            "update", "HusteDev.Imaguncula",
            "-u", $env:INSTALLER_URL,
            "-v", $env:RELEASE_VERSION,
            "-t", $token
          )
          if ($env:SUBMIT -eq "true") { $arguments += "--submit" }
          & ../../wingetcreate.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "WingetCreate failed with exit code $LASTEXITCODE." }
          Pop-Location

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winget-manifest-${{ inputs.version }}
          path: distribution/winget/**/*.yaml
          if-no-files-found: error

  homebrew:
    name: Generate Homebrew formula
    runs-on: macos-latest
    timeout-minutes: 45
    environment: homebrew
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: source/.node-version

      - name: Generate formula from the immutable source tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/v$RELEASE_VERSION.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output source.tar.gz
          sha256="$(sha256sum source.tar.gz | cut -d' ' -f1)"
          node source/scripts/render-homebrew-formula.mjs \
            "--version=$RELEASE_VERSION" \
            "--sha256=$sha256" \
            "--url=$url" \
            "--output=generated/imaguncula.rb"

      - name: Build, install, and test the generated formula
        shell: bash
        run: |
          set -euo pipefail
          brew style --formula generated/imaguncula.rb
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source generated/imaguncula.rb
          brew test generated/imaguncula.rb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-formula-${{ inputs.version }}
          path: generated/imaguncula.rb
          if-no-files-found: error

      - name: Check out Homebrew tap
        if: inputs.submit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HusteDev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push reviewed formula to tap
        if: inputs.submit
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$HOMEBREW_TAP_TOKEN" ]]
          mkdir -p tap/Formula
          cp generated/imaguncula.rb tap/Formula/imaguncula.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/imaguncula.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "imaguncula $RELEASE_VERSION"
          git push
